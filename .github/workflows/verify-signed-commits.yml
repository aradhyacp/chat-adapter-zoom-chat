name: Verify Signed Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-signed-commits:
    name: Verify signed commits
    runs-on: ubuntu-latest
    steps:
      - name: Check all PR commits are signed and verified
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            const unverified = commits.filter(
              (c) => !c.commit?.verification?.verified
            );

            if (unverified.length > 0) {
              const shas = unverified.map((c) => ` - ${c.sha}`).join('\n');
              core.setFailed(
                `All commits in a PR must be signed and verified. Unverified commits:\n${shas}`
              );
            } else {
              core.info(`All ${commits.length} commit(s) are signed and verified.`);
            }
