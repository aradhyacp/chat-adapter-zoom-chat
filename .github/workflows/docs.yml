name: Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      - "turbo.json"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      - "turbo.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site is deployed from Vercel, so CI only has to prove it builds
      # clean and that every internal link still resolves.
      - run: pnpm --filter docs build
      - run: pnpm --filter docs validate
      # Vercel Web Analytics is emitted in production builds only, and nothing
      # else fails when it silently drops out of the config: prove the
      # component element actually reached the built pages.
      - name: Check Vercel Web Analytics is wired
        run: grep -rq "<vercel-analytics" apps/docs/dist
