name: Notify on Failure

on:
  workflow_run:
    workflows: [Test, PR Checks, Verify Signed Commits]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment-on-pr:
    name: Comment on PR when a check fails
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for failed run and comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Find PRs associated with the failed run's head SHA.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: run.head_sha,
            });

            if (prs.length === 0) {
              core.info(`No PR found for commit ${run.head_sha}, skipping comment.`);
              return;
            }

            const body =
              `@dev this action failed (${run.name}) can you please check it out and fix it thank you.\n\n` +
              `Failed run: ${run.html_url}`;

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Commented on PR #${pr.number} for failed run ${run.id}.`);
            }
